name: Release Python package

# Publishes the zero-dependency Python port in python/ to PyPI using trusted publishing.
#
# PyPI setup (one-time): add a trusted publisher for project `deshiqr` pointing at
# this repository, workflow `release-python.yml`, environment `pypi`. No API token secret needed.
# Until that is configured this job fails without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: test and build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test the Python package
        working-directory: python
        run: python -m unittest discover -s tests -v

      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: deshiqr-python-dist
          path: python/dist/
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deshiqr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deshiqr-python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
